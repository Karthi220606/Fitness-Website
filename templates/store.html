{% extends "base.html" %}
{% block content %}
<h1>Supplement Store</h1>
<p>Top-quality fitness essentials to help you stay strong and healthy 🏋️‍♂️</p>

<section class="cards">
  {% for item in items %}
  <div class="card store-card">
    <h3>{{ item.name }}</h3>
    <p>{{ item.desc }}</p>
    <span class="price">₹{{ "%.2f"|format(item.price) }}</span>
  </div>
  {% endfor %}
</section>
{% endblock %}
